name: 缺陷报告
description: 报告可以稳定复现的产品问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "请勿提交 API Key、客户素材、私有剧本或个人信息。安全问题请使用 Security Advisory。"
  - type: input
    id: version
    attributes:
      label: 应用版本与 macOS 版本
      placeholder: "V4.3.5 / macOS 15.x / Apple M2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供最少且可重复的步骤，内容需要脱敏。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

